org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.stdlib.default.dependency=true

# IntelliJ Platform version to build against. WebStorm 2025.2 is built on the
# 252 platform, so an artifact built against the community platform installs and
# runs there. To run the sandbox on WebStorm itself, set CWC_WEBSTORM=true.
platformVersion=2025.2
platformSinceBuild=252
platformUntilBuild=253.*

# Set to true (and provide a WebStorm licence) to resolve WebStorm instead of
# the free IntelliJ IDEA Community platform.
cwcWebStorm=false
